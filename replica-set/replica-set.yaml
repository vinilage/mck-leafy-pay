apiVersion: mongodb.com/v1
kind: MongoDB
metadata:
  name: replica-set
  namespace: leafy-pay
spec:
  type: ReplicaSet
  members: 3
  version: "8.3.3-ent"
  persistent: true
  # OpsManager Config
  opsManager:
    configMapRef:
      name: leafy-org
  credentials: organization-secret
  # Disable authentication to be able to manage the database without credentials
  # do not do this in production environments
  security:
    authentication:
      enabled: false
  podSpec:
      podTemplate:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001350000
            fsGroup: 1001350000
#### only if the app needs to be accessed from outside the cluster, uncomment the following lines
#  externalAccess:
#      externalService:
#        spec:
#          type: LoadBalancer
---

apiVersion: v1
kind: Secret
metadata:
  name: organization-secret
  namespace: leafy-pay
stringData:
  user: rekezici
